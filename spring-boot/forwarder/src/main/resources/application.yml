spring:
  application:
    name: flume-forwarder

server:
  port: 6433

nextiva:
  swagger:
    show-build-info: true
    show-git-info: true

flume:
  dataPath: /opt/flume-forwarder
  metrics: http
  source:
    port: 4141
    bind: 0.0.0.0
    compression-type: deflate
    threads: 0

  channels:
    fileChannel1:
      checkpointDir: ${flume.dataPath}/Checkpoint1
      dataDirs: ${flume.dataPath}/Data1
      minimumRequiredSpace: 524288000
      capacity: 200000000
    fileChannel2:
      checkpointDir: ${flume.dataPath}/Checkpoint2
      dataDirs: ${flume.dataPath}/Data2
      minimumRequiredSpace: 524288000
      capacity: 200000000
    fileChannel3:
      checkpointDir: ${flume.dataPath}/Checkpoint3
      dataDirs: ${flume.dataPath}/Data3
      minimumRequiredSpace: 524288000
      capacity: 200000000
    fileChannel4:
      checkpointDir: ${flume.dataPath}/Checkpoint4
      dataDirs: ${flume.dataPath}/Data4
      minimumRequiredSpace: 524288000
      capacity: 200000000

  sinkGroups:
    rrobin:
      backoff: true
      selector: round_robin
      "selector.maxTimeOut": 30000

  sinks:
    avroSink1:
      port: 4141
      batch-size: 100
      compression-type: deflate
    avroSink2:
      port: 4141
      batch-size: 100
      compression-type: deflate
