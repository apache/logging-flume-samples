#
# Flume Forwarder Configuration
# This file contains configuration for one Agent identified as host1 that accepts
# incoming events and then routes them to downstream Flume Agents.
#

dataPath: /opt/flume-forwarder

forwarder:
  sources:
    source1:
      port: 4141
      bind: 0.0.0.0
      compression-type: deflate
      threads: 0
      type: avro
      channels:
        - fileChannel1
        - fileChannel2
      selector:
        type: load_balancing
        policy: round_robin
  channels:
    fileChannel1:
      type: file
      checkpointDir: ${dataPath}/Checkpoint1
      dataDirs: ${dataPath}/Data1
      minimumRequiredSpace: 524288000
      capacity: 200000000
    fileChannel2:
      type: file
      checkpointDir: ${dataPath}/Checkpoint2
      dataDirs: ${dataPath}/Data2
      minimumRequiredSpace: 524288000
      capacity: 200000000
  sinks:
    avroSink1:
      type: avro
      port: 4141
      batch-size: 100
      compression-type: deflate
      channel: fileChannel1
    avroSink2:
      type: avro
      port: 4141
      batch-size: 100
      compression-type: deflate
      channel: fileChannel2
